<html lang="id">

<title>StrawSunBurries</title>
<style>
body { margin:0; background:#1a130e; color:#e8dcc3; font-family: Georgia, serif; text-align:center; }
.hero { padding: 80px 20px; background: linear-gradient(#2b1d12, #1a130e); }
h1 { font-size: 44px; letter-spacing: 3px; margin: 10px 0; line-height:1.2; }
p { color:#cbb894; line-height:1.9; max-width:650px; margin: 0 auto; }

.gallery img { width:100%; border:2px solid #4a3823; border-radius:10px; margin-top:15px; }

.folder span { font-size:40px; display:block; margin-bottom:10px; }
.folder b { font-size:16px; letter-spacing:1px; }
.folder small { color:#cbb894; display:block; margin-top:5px; }
